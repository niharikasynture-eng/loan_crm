<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Premium Gradient -->
    <linearGradient id="dealbyte-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- Indigo-600 -->
      <stop offset="100%" stop-color="#06B6D4" /> <!-- Cyan-500 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Base background (transparent in SVG, but defined nicely) -->
  <g filter="url(#glow)">
    <!-- Sleek Tech D & B combined shape -->
    <!-- Left vertical bar with gradient -->
    <rect x="25" y="20" width="14" height="60" rx="7" fill="url(#dealbyte-grad)" />
    
    <!-- Outer loop (D-shape) -->
    <path d="M 39 20 
             C 65 20, 75 32, 75 42 
             C 75 50, 65 58, 39 58 Z" 
          fill="none" 
          stroke="url(#dealbyte-grad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Inner bite/byte loop (B-shape bottom half / Tech connection) -->
    <path d="M 39 48 
             C 60 48, 70 56, 70 68 
             C 70 78, 58 80, 39 80" 
          fill="none" 
          stroke="url(#dealbyte-grad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Small tech dot inside representing a "byte" of data -->
    <circle cx="50" cy="50" r="5" fill="#06B6D4" />
  </g>
</svg>
